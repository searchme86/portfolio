<!DOCTYPE html>
<html lang="ko">
  <head>
    <!-- /src/components/scroll-animation/gsap_스크롤_균등패턴_애니메이션.html -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>균등한 패턴의 스크롤 애니메이션</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display',
          'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
        background-color: #f5f5f7;
      }

      .scroll-container {
        height: 100vh;
        position: relative;
      }

      .black-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
        pointer-events: none;
      }

      .background-left {
        position: absolute;
        top: 0;
        left: 0;
        width: 50vw;
        height: 100vh;
        background-color: #000;
        transform-origin: right center;
      }

      .background-right {
        position: absolute;
        top: 0;
        right: 0;
        width: 50vw;
        height: 100vh;
        background-color: #000;
        transform-origin: left center;
      }

      .text-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
        text-align: center;
        pointer-events: none;
        overflow: hidden;
        height: 100px;
        width: 100%;
      }

      .text-list {
        list-style: none;
        margin: 0;
        padding: 0;
        transform: translateY(-400px);
      }

      .text-item {
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #1d1d1f;
        opacity: 0;
        transform: scale(0.3);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display',
          sans-serif;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.02);
      }

      @media (max-width: 768px) {
        .text-item {
          font-size: 24px;
        }

        .content-text {
          font-size: 1.8rem;
        }
      }

      .content-section {
        height: 100vh;
        background: red;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 3;
      }

      .content-text {
        font-size: 2.5rem;
        font-weight: 400;
        color: #1d1d1f;
        text-align: center;
        padding: 2rem;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }

      .debug-info {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 10px;
        font-family: monospace;
        font-size: 12px;
        z-index: 999;
        border-radius: 5px;
      }

      .pattern-info {
        position: fixed;
        top: 10px;
        right: 10px;
        background: rgba(0, 100, 200, 0.9);
        color: white;
        padding: 10px;
        font-family: monospace;
        font-size: 11px;
        z-index: 999;
        border-radius: 5px;
        max-width: 300px;
      }
    </style>
  </head>
  <body>
    <div class="debug-info" id="debugInfo">스크롤 진행도: 0%</div>
    <div class="pattern-info">
      <strong>균등 패턴:</strong><br>
      1. 커튼 열기 (0→20%)<br>
      2. Future (20→35%)<br>
      3. Design (35→50%)<br>
      4. Excellence (50→65%)<br>
      5. Innovation (65→80%)<br>
      6. Think Different (80→100%)
    </div>

    <div class="scroll-container">
      <div class="black-background">
        <div class="background-left" id="backgroundLeft"></div>
        <div class="background-right" id="backgroundRight"></div>
      </div>

      <div class="text-container">
        <ul class="text-list" id="textList">
          <li class="text-item" id="textItem1">Think Different</li>
          <li class="text-item" id="textItem2">Innovation</li>
          <li class="text-item" id="textItem3">Excellence</li>
          <li class="text-item" id="textItem4">Design</li>
          <li class="text-item" id="textItem5">Future</li>
        </ul>
      </div>
    </div>

    <div class="content-section">
      <div class="content-text">균등한 패턴으로 수정된 애니메이션</div>
    </div>

    <script>
      console.log('🎬 균등 패턴 스크롤 애니메이션 초기화');

      gsap.registerPlugin(ScrollTrigger);

      const backgroundLeftElement = document.getElementById('backgroundLeft');
      const backgroundRightElement = document.getElementById('backgroundRight');
      const textListElement = document.getElementById('textList');
      const textItem1Element = document.getElementById('textItem1');
      const textItem2Element = document.getElementById('textItem2');
      const textItem3Element = document.getElementById('textItem3');
      const textItem4Element = document.getElementById('textItem4');
      const textItem5Element = document.getElementById('textItem5');
      const debugInfoElement = document.getElementById('debugInfo');

      console.log('📋 균등 패턴 타임라인 구성:', {
        '0-20%': '커튼 열기',
        '20-35%': 'Future (안정적)',
        '35-50%': 'Design (안정적)', 
        '50-65%': 'Excellence (안정적)',
        '65-80%': 'Innovation (안정적)',
        '80-100%': 'Think Different (안정적)'
      });

      const masterTimeline = gsap.timeline({
        scrollTrigger: {
          trigger: '.scroll-container',
          start: 'top top',
          end: 'bottom top',
          scrub: 1,
          pin: '.scroll-container',
          onUpdate: function (self) {
            const progress = Math.round(self.progress * 100);
            debugInfoElement.textContent = `스크롤 진행도: ${progress}%`;
            console.log('📊 균등 패턴 진행도:', progress + '%');
          },
        },
      });

      // 1단계: 배경 좌우 분할 (0% → 20%)
      masterTimeline.to(backgroundLeftElement, {
        duration: 0.2,
        x: '-100%',
        ease: 'power2.inOut',
      }, 0);

      masterTimeline.to(backgroundRightElement, {
        duration: 0.2,
        x: '100%',
        ease: 'power2.inOut',
      }, 0);

      // 2단계: Future 등장 및 기본 사라짐 (10% → 35%)
      masterTimeline.to(textItem5Element, {
        duration: 0.15,
        opacity: 1,
        scale: 2.3,
        ease: 'power2.out',
      }, 0.1);

      // Future 기본 사라짐
      masterTimeline.to(textItem5Element, {
        duration: 0.05,
        opacity: 0,
        ease: 'power2.out',
      }, 0.35);

      // 3단계: ul 이동 + Design 등장 및 대형 스케일 (35% → 55%)
      masterTimeline.to(textListElement, {
        duration: 0.05,
        y: '-300px',
        ease: 'power2.inOut',
      }, 0.35);

      masterTimeline.to(textItem4Element, {
        duration: 0.2,   // 긴 지속시간
        opacity: 1,
        scale: 4.2,      // 매우 큰 스케일
        ease: 'power2.out',
      }, 0.4);

      // Design 위로 사라지며 블러 효과
      masterTimeline.to(textItem4Element, {
        duration: 0.15,
        opacity: 0,
        y: '-180px',     // 위로 크게 사라짐
        filter: 'blur(5px)', // 블러 효과 추가
        ease: 'power2.in',
      }, 0.55);

      // 4단계: ul 이동 + Excellence 등장 및 왼쪽 사라짐 (55% → 70%)
      masterTimeline.to(textListElement, {
        duration: 0.05,
        y: '-200px',
        ease: 'power2.inOut',
      }, 0.55);

      masterTimeline.to(textItem3Element, {
        duration: 0.1,
        opacity: 1,
        scale: 2.8,      // 중간 스케일
        ease: 'power2.out',
      }, 0.6);

      // Excellence 왼쪽으로 사라짐
      masterTimeline.to(textItem3Element, {
        duration: 0.05,
        opacity: 0,
        x: '-250px',     // 왼쪽으로 사라짐
        ease: 'power2.in',
      }, 0.65);

      // 5단계: ul 이동 + Innovation 등장 및 기본 사라짐 (70% → 85%)
      masterTimeline.to(textListElement, {
        duration: 0.05,
        y: '-100px',
        ease: 'power2.inOut',
      }, 0.7);

      masterTimeline.to(textItem2Element, {
        duration: 0.1,
        opacity: 1,
        scale: 2.3,      // 기본 스케일
        ease: 'power2.out',
      }, 0.75);

      // Innovation 기본 사라짐
      masterTimeline.to(textItem2Element, {
        duration: 0.05,
        opacity: 0,
        ease: 'power2.out',
      }, 0.8);

      // 6단계: Think Different 등장 및 기본 스케일 (80% → 90%)
      masterTimeline.to(textListElement, {
        duration: 0.05,
        y: '0px',
        ease: 'power2.inOut',
      }, 0.8);

      masterTimeline.to(textItem1Element, {
        duration: 0.1,
        opacity: 1,
        scale: 2.3,      // 기본 스케일
        ease: 'power2.out',
      }, 0.85);

      // 7단계: ul 전체가 오른쪽으로 사라짐 (90% → 100%)
      masterTimeline.to(textListElement, {
        duration: 0.1,
        x: '100vw',
        ease: 'power2.in',
      }, 0.9);

      function logEqualPatternStructure() {
        console.log('🎯 균등 패턴 구조 분석:', {
          패턴: '각 텍스트마다 15% 구간 할당',
          구성: '5% 이동 + 10% 안정 표시',
          장점: 'Future도 다른 텍스트와 동일한 느낌',
          개선: 'ul 이동과 텍스트 표시 분리'
        });
      }

      window.addEventListener('load', () => {
        console.log('🚀 균등 패턴 페이지 로드 완료');
        logEqualPatternStructure();
      });

      window.addEventListener('resize', () => {
        console.log('📱 화면 크기 변경 감지');
        ScrollTrigger.refresh();
      });
    </script>
  </body>
</html>
